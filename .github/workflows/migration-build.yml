name: Migration Build Check

on:
  push:
    branches:
      - migration/cloudflare-supabase
      - migration/final-cleanup
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

      - name: Build
        run: |
          bun run build
          test -s dist/server/index.js
          test -s dist/server/wrangler.json
          test -d dist/client/assets

      - name: Verify build leaves repository unchanged
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            echo "Build or install changed repository files. Commit generated routes during development."
            exit 1
          fi

      - name: Lint
        run: bun run lint
