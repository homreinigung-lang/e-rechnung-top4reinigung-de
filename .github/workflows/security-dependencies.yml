name: Dependency vulnerability check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/security-dependencies.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/security-dependencies.yml'
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Audit locked dependencies (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.0'
      - name: Verify Bun lockfile exists
        run: test -f bun.lock || test -f bun.lockb
      - name: Audit committed dependency graph
        run: bun audit --audit-level=high
      - name: Verify repository stayed unchanged
        if: always()
        run: git diff --exit-code -- package.json bun.lock bun.lockb
