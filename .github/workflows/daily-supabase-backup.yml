name: Daily encrypted Supabase database backup

on:
  schedule:
    - cron: '15 2 * * *' # 02:15 UTC; GitHub schedules may be delayed or skipped.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
      # Public key only. The matching private key is NEVER stored in GitHub.
      BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Verify required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          for v in DATABASE_URL BACKUP_AGE_PUBLIC_KEY R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!v}" ]]; then
              echo "Missing secret for $v. Configure it in repository Actions secrets." >&2
              exit 1
            fi
          done
          if [[ "$DATABASE_URL" != *squkjqvofugkanzuqtqn* ]]; then
            echo 'Database URL does not identify the intended Hom.r.ofice Supabase project. Aborting.' >&2
            exit 1
          fi
          if [[ "$BACKUP_AGE_PUBLIC_KEY" != age1* ]]; then
            echo 'BACKUP_AGE_PUBLIC_KEY must be an age public key (starts with age1). Never put the private key here.' >&2
            exit 1
          fi

      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Verify AWS CLI is available
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null 2>&1 || {
            echo 'AWS CLI is required on the GitHub runner but was not found.' >&2
            exit 1
          }
          aws --version

      - name: Dump database and verify archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-backup"
          chmod 700 "$RUNNER_TEMP/supabase-backup"
          docker run --rm \
            -e DATABASE_URL \
            -v "$RUNNER_TEMP/supabase-backup:/backup" \
            postgres:17 \
            sh -c 'set -eu; pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/database.dump; pg_restore --list /backup/database.dump >/dev/null'
          test -s "$RUNNER_TEMP/supabase-backup/database.dump"

      - name: Encrypt and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          age -r "$BACKUP_AGE_PUBLIC_KEY" \
            -o "$RUNNER_TEMP/supabase-backup/database.dump.age" \
            "$RUNNER_TEMP/supabase-backup/database.dump"
          test -s "$RUNNER_TEMP/supabase-backup/database.dump.age"
          (cd "$RUNNER_TEMP/supabase-backup" && sha256sum database.dump.age > database.dump.age.sha256)
          rm -f "$RUNNER_TEMP/supabase-backup/database.dump"

      - name: Upload encrypted backup to private Cloudflare R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="backups/$(date -u +%Y/%m)/hom-office-$(date -u +%Y%m%dT%H%M%SZ)-run${GITHUB_RUN_ID}"
          for f in database.dump.age database.dump.age.sha256; do
            aws s3 cp "$RUNNER_TEMP/supabase-backup/$f" "s3://${R2_BUCKET}/${prefix}-$f" \
              --endpoint-url "$endpoint" --only-show-errors
            aws s3api head-object --bucket "$R2_BUCKET" --key "${prefix}-$f" \
              --endpoint-url "$endpoint" >/dev/null
          done
          echo "Uploaded encrypted backup to R2 (private bucket)."

      - name: Remove temporary local backup files
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/supabase-backup"
