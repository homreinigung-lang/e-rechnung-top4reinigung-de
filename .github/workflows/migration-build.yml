name: Migration Build Check

on:
  push:
    branches:
      - migration/cloudflare-supabase
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-supabase

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Commit updated Bun lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync Bun lockfile"
          git push origin HEAD:migration/cloudflare-supabase
