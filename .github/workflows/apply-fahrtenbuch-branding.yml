name: Apply shared Fahrtenbuch PDF branding

on:
  push:
    branches:
      - release/gobd-fahrtenbuch-20260916
    paths:
      - '.github/workflows/apply-fahrtenbuch-branding.yml'

permissions:
  contents: write

jobs:
  apply-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/gobd-fahrtenbuch-20260916
          persist-credentials: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.4.2'
      - name: Switch all three download buttons to the same branded renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
            Path('src/routes/_authenticated/fahrtenbuch.tsx'),
            Path('src/components/PersonalPanel.tsx'),
            Path('src/routes/_authenticated/steuerberater.tsx'),
          ]
          old_import = 'const { buildAccountantFahrtenbuchPdf } = await import("@/lib/fahrtenbuch-accountant-pdf");'
          new_import = 'const { buildBrandedFahrtenbuchPdf } = await import("@/lib/fahrtenbuch-branded-pdf");'
          replacements = [
            ('buildAccountantFahrtenbuchPdf(rows, from, to)', 'await buildBrandedFahrtenbuchPdf(rows, from, to)'),
            ('buildAccountantFahrtenbuchPdf(rows, `${reportMonth}-01`, reportMonthEnd)', 'await buildBrandedFahrtenbuchPdf(rows, `${reportMonth}-01`, reportMonthEnd)'),
            ('buildAccountantFahrtenbuchPdf(fahrtenbuchRows, from, to)', 'await buildBrandedFahrtenbuchPdf(fahrtenbuchRows, from, to)'),
          ]
          for path in paths:
            text = path.read_text()
            if text.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one import in {path}, found {text.count(old_import)}')
            text = text.replace(old_import, new_import)
            count = 0
            for old, new in replacements:
              n = text.count(old)
              if n:
                if n != 1: raise SystemExit(f'Expected one PDF call in {path}, found {n}')
                text = text.replace(old, new)
                count += 1
            if count != 1: raise SystemExit(f'Expected one PDF call in {path}, found {count}')
            path.write_text(text)
          PY
      - name: Validate without production services
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run test
          bun run build
      - name: Save tested changes to release branch
        run: |
          git add 'src/routes/_authenticated/fahrtenbuch.tsx' 'src/components/PersonalPanel.tsx' 'src/routes/_authenticated/steuerberater.tsx'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: use branded Fahrtenbuch PDF in all three views'
          git push origin HEAD:release/gobd-fahrtenbuch-20260916
