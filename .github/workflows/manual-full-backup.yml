name: Manual encrypted full database and storage backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-full-project-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://squkjqvofugkanzuqtqn.supabase.co
      # Public key only. The matching private key is NEVER stored in GitHub.
      BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
    steps:
      - name: Verify required secrets are configured
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_BACKUP_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for v in DATABASE_URL BACKUP_AGE_PUBLIC_KEY SUPABASE_SECRET_KEY; do
            if [[ -z "${!v}" ]]; then
              echo "Missing secret for $v. Configure it in repository Actions secrets." >&2
              exit 1
            fi
          done
          if [[ "$DATABASE_URL" != *squkjqvofugkanzuqtqn* ]]; then
            echo 'Database URL does not identify the intended Hom.r.ofice Supabase project. Aborting.' >&2
            exit 1
          fi
          if [[ "$BACKUP_AGE_PUBLIC_KEY" != age1* ]]; then
            echo 'BACKUP_AGE_PUBLIC_KEY must be an age public key (starts with age1). Never put the private key here.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Dump database and verify archive
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-backup"
          chmod 700 "$RUNNER_TEMP/supabase-backup"
          docker run --rm \
            -e DATABASE_URL \
            -v "$RUNNER_TEMP/supabase-backup:/backup" \
            postgres:17 \
            sh -c 'set -eu; pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/database.dump; pg_restore --list /backup/database.dump >/dev/null'
          test -s "$RUNNER_TEMP/supabase-backup/database.dump"

      - name: Download and verify all storage buckets
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_BACKUP_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/download-storage.mjs production "$RUNNER_TEMP/supabase-backup/storage"
          tar -C "$RUNNER_TEMP/supabase-backup" -cf "$RUNNER_TEMP/supabase-backup/storage.tar" storage
          age -r "$BACKUP_AGE_PUBLIC_KEY" \
            -o "$RUNNER_TEMP/supabase-backup/storage.tar.age" \
            "$RUNNER_TEMP/supabase-backup/storage.tar"
          (cd "$RUNNER_TEMP/supabase-backup" && sha256sum storage.tar.age > storage.tar.age.sha256)
          rm -rf -- "$RUNNER_TEMP/supabase-backup/storage" "$RUNNER_TEMP/supabase-backup/storage.tar"

      - name: Encrypt and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          age -r "$BACKUP_AGE_PUBLIC_KEY" \
            -o "$RUNNER_TEMP/supabase-backup/database.dump.age" \
            "$RUNNER_TEMP/supabase-backup/database.dump"
          test -s "$RUNNER_TEMP/supabase-backup/database.dump.age"
          (cd "$RUNNER_TEMP/supabase-backup" && sha256sum database.dump.age > database.dump.age.sha256)
          rm -f "$RUNNER_TEMP/supabase-backup/database.dump"

      - name: Upload encrypted backup as GitHub Actions artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-full-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/supabase-backup/database.dump.age
            ${{ runner.temp }}/supabase-backup/database.dump.age.sha256
            ${{ runner.temp }}/supabase-backup/storage.tar.age
            ${{ runner.temp }}/supabase-backup/storage.tar.age.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Remove temporary local backup files
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/supabase-backup"
