name: Prepare dependency security repair

on:
  push:
    branches:
      - release/gobd-fahrtenbuch-20260916
    paths:
      - '.github/workflows/repair-dependency-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: release/gobd-fahrtenbuch-20260916
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.4.2'
      - name: Install exact committed dependencies
        run: bun install --frozen-lockfile
      - name: Apply minimal sharp security override
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          pkg = json.loads(path.read_text())
          pkg.setdefault('overrides', {})['sharp'] = '^0.35.4'
          path.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Update affected transitive packages
        run: |
          bun install
          bun update fast-uri brace-expansion nanoid js-yaml
      - name: Verify dependency graph
        run: bun audit --audit-level=high
      - name: Verify TypeScript tests and build
        run: |
          bunx tsc --noEmit
          bun run test
          bun run build
          bun install --frozen-lockfile
      - name: Commit audited manifest and lockfile only on release branch
        run: |
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo 'No dependency changes produced'; exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'security: refresh vulnerable transitive dependencies'
          git pull --rebase origin release/gobd-fahrtenbuch-20260916
          git push origin HEAD:release/gobd-fahrtenbuch-20260916
